# =============================================================================
# RGCN retrain configuration (rgcn-retrain branch)
# =============================================================================
# Repo-relative replacement for rgcn_config.yaml, which hardcoded the cluster
# path /data/kripat/usgs-gnn. All paths here are resolved relative to the repo
# root by rgcn.pipeline.config.load_config(). See RGCN_RETRAIN_PLAN.md.
#
# Golden rule: never overwrite released artifacts. Every output below uses a
# NEW filename so data/huggingface/{best_model.pt,hja_graph.gpickle,
# window_split_map.csv} stay untouched.

paths:
  # Inputs (populated by download_data.py)
  obs_csv: "data/sciencebase/obs.csv"
  met_drivers_csv: "data/sciencebase/met_drivers.csv"
  static_vars_csv: "data/sciencebase/static_vars.csv"
  released_graph: "data/huggingface/hja_graph.gpickle"   # read-only: topology source

  # Intermediate / derived (new filenames — safe to regenerate)
  drivers_parquet: "data/retrain/met_drivers.parquet"    # fast-load copy of the 2.13 GB csv
  graph_out: "data/retrain/hja_graph_drivers.gpickle"    # graph WITH gridmet_ts + normalized statics
  split_map: "data/retrain/window_split_map_temporal80.csv"
  split_meta: "data/retrain/split_meta.json"             # cutoff date + rule (reproducibility)
  scaler_json: "data/retrain/feature_scaler.json"        # train-only normalization stats
  feature_arrays: "data/retrain/feature_arrays.npz"      # normalized grids (split-specific!)
  checkpoint: "data/retrain/best_model_retrain.pt"
  predictions_dir: "data/retrain/predictions"            # train_val_predictions_day{1,2,3}.csv

# -----------------------------------------------------------------------------
# Windowing (shared by make_splits, training, and export — keep consistent)
# -----------------------------------------------------------------------------
windows:
  date_start: "1980-01-01"
  date_end: "2020-12-31"
  seq_length: 28          # history/context length
  forecast_horizon: 3     # day-3 forecast = last timestep of the 31-day window
  stride: 3               # step between successive window starts

# -----------------------------------------------------------------------------
# Split (decision §2.2 + §3): single global temporal cutoff placed inside the
# 2020 dry season so the scarce wet/dry labels split ~80/20, while discharge
# keeps its full 1980-2020 history in train.
# -----------------------------------------------------------------------------
split:
  method: quantile_cutoff   # quantile_cutoff | holdout_blocks (see make_splits.py)
  # cutoff = this quantile of wet/dry (HoboWetDry0.05) label dates.
  # train = windows whose day-3 date <= cutoff; val = after.
  wetdry_quantile: 0.80

# -----------------------------------------------------------------------------
# Model (unchanged from released RGCN_v2 unless ablating)
# -----------------------------------------------------------------------------
model:
  version: "v2"
  hidden_dim: 64
  dropout: 0.1
  recur_dropout: 0.0
  return_states: false
  # input_dim is derived at runtime from the feature list (see features.py)

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 20
  lambda_discharge: 1.0
  lambda_wetdry: 0.5
  false_positive_weight: 2.0   # dry-sample BCE up-weight (released masked_multitask_weighted_loss)
  seed: 42
